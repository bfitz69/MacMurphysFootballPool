<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MacMurphy's Week 1 Football Pool</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
            --correct: #22c55e;
            --wrong: #ef4444;
            --hover: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
        }
        .header h1 {
            margin: 0;
            color: var(--accent);
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }
        .header p {
            color: var(--muted);
            margin: 6px 0 0 0;
            font-size: 1rem;
        }
        
        /* Table Styles */
        .table-container {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }
        th {
            background: #090d16;
            color: var(--muted);
            padding: 14px 12px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }
        tr {
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        tr:hover {
            background-color: var(--hover);
        }
        
        /* Badges & Buttons */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
        }
        .badge.F {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .badge.D {
            background: rgba(249, 115, 22, 0.15);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }
        .btn-view {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            pointer-events: none;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            background: var(--hover);
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            transition: background 0.2s;
            cursor: pointer;
            border: 1px solid var(--border);
        }
        .btn-back:hover {
            background: #475569;
        }
        
        /* Details View */
        .details-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
        }
        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .details-header h2 {
            margin: 0;
            color: #ffffff;
            font-size: 1.8rem;
        }
        .details-stats {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-box {
            flex: 1;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-label {
            display: block;
            color: var(--muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .stat-val {
            font-weight: 800;
            color: #ffffff;
            font-size: 1.15rem;
        }
        
        /* Game List */
        .game-row {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            font-size: 0.95rem;
        }
        .game-row:last-child {
            border-bottom: none;
        }
        .matchup {
            flex: 1;
        }
        .spread {
            color: var(--muted);
            font-size: 0.8rem;
            margin-left: 4px;
        }
        .pick-col {
            flex: 0 0 130px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }
        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 13px;
            font-weight: bold;
        }
        .icon.correct {
            background: rgba(34, 197, 94, 0.2);
            color: var(--correct);
        }
        .icon.wrong {
            background: rgba(239, 68, 68, 0.2);
            color: var(--wrong);
        }

        /* View Toggles */
        #list-view { display: block; }
        #detail-view { display: none; }

        /* --- MOBILE OPTIMIZATIONS --- */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .header h1 {
                font-size: 1.6rem;
            }
            .header p {
                font-size: 0.9rem;
            }
            .table-container {
                border-radius: 8px;
            }
            th {
                padding: 12px 8px;
                font-size: 0.75rem;
            }
            td {
                padding: 12px 8px;
                font-size: 0.9rem;
            }
            /* Abbreviate table headers for space */
            .th-long { display: none; }
            .th-short { display: inline; }
            
            .btn-view {
                padding: 6px 8px;
                font-size: 0.75rem;
            }
            .btn-back {
                width: 100%; /* Full width thumb target on mobile */
                box-sizing: border-box;
                font-size: 1rem;
                padding: 12px;
            }
            .details-panel {
                padding: 16px;
            }
            .details-header h2 {
                font-size: 1.5rem;
            }
            /* Stack stats vertically on small screens */
            .details-stats {
                flex-direction: column;
                gap: 8px;
            }
            .stat-box {
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: left;
                padding: 10px 16px;
            }
            .stat-label {
                margin-bottom: 0;
            }
            .game-row {
                font-size: 0.85rem;
                flex-wrap: wrap; /* Allows tighter fit */
            }
            .pick-col {
                flex: 0 0 auto;
                gap: 8px;
            }
            .matchup {
                margin-right: auto;
            }
        }
        @media (min-width: 601px) {
            .th-short { display: none; }
        }
    </style>
</head>

</div>

    function renderTable() {
        const tbody = document.getElementById('leaderboard-body');
        let html = '';
        let currentRank = 1;
        let previousWins = -1;

        data.participants.forEach((p, index) => {
            if (p.wins !== previousWins) {
                currentRank = index + 1;
                previousWins = p.wins;
            }
            
            let pickName = p.mnf_pick === 'F' ? data.mnf.fav : data.mnf.dog;
            // Truncate long names for mobile view
            let mobilePickName = pickName.substring(0,3).toUpperCase(); 
            
            html += `
                <tr onclick="showDetails('${p.code}')">
                    <td style="font-weight:700; color:var(--muted);">${currentRank}</td>
                    <td style="font-weight:700; color:#fff;">${p.code}</td>
                    <td style="color:var(--accent); font-weight:700;">${p.wins}</td>
                    <td>
                        <span class="badge ${p.mnf_pick}">
                            <span class="th-long">${pickName} (${p.mnf_pick})</span>
                            <span class="th-short">${mobilePickName} (${p.mnf_pick})</span>
                        </span>
                    </td>
                    <td>${p.tb_pts}</td>
                    <td><a href="#" onclick="event.preventDefault();" class="btn-view">View</a></td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function showDetails(code) {

        document.getElementById('detail-view').style.display = 'block';
        window.scrollTo(0, 0); 
        
        const p = data.participants.find(x => x.code === code);
        const content = document.getElementById('details-content');
        if (!p) return;
        
        let pickName = p.mnf_pick === 'F' ? data.mnf.fav : data.mnf.dog;
        
        let html = `
            <div class="details-header">
                <h2>${p.code}'s Picks</h2>
            </div>
            <div class="details-stats">
                <div class="stat-box">
                    <span class="stat-label">Total Wins</span>
                    <span class="stat-val" style="color:var(--accent)">${p.wins} / 13</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">MNF Pick</span>
                    <span class="badge ${p.mnf_pick}" style="font-size:0.9rem">${pickName}</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Tiebreaker</span>
                    <span class="stat-val">${p.tb_pts} Pts</span>
                </div>
            </div>
            <div class="games-list">
        `;
                    
        data.games.forEach((g, i) => {
            const pick = p.picks[i];
            const actual = data.actuals[i];
            const isCorrect = pick === actual;
            
            let pickedTeam = pick === 'F' ? g.fav : g.dog;
            let iconClass = isCorrect ? 'correct' : 'wrong';
            let iconMark = isCorrect ? '✓' : '✗';
            
            html += `
                <div class="game-row">
                    <div class="matchup">
                        <strong>${g.fav}</strong> <span class="spread">(-${g.spread})</span> 
                        <span style="color:var(--muted); margin:0 4px;">vs</span> 
                        <strong>${g.dog}</strong>
                    </div>
                    <div class="pick-col">
                        <span class="badge ${pick}">${pickedTeam}</span>
                        <span class="icon ${iconClass}">${iconMark}</span>
                    </div>
                </div>
            `;
        });
        
        html += `</div>`;
        content.innerHTML = html;
    }

    function showList() {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('list-view').style.display = 'block';
        window.scrollTo(0, 0);
    }

    // Initialize on load
    window.onload = renderTable;
</script>

</body>
</html>
