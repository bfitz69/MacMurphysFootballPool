<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacMurphy's Week 1 Football Pool</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
            --correct: #22c55e;
            --wrong: #ef4444;
            --hover: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            color: var(--accent);
            font-size: 2.2rem;
            letter-spacing: -0.5px;
        }
        .header p {
            color: var(--muted);
            margin: 8px 0 0 0;
            font-size: 1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            align-items: start;
        }
        @media (min-width: 900px) {
            .grid { grid-template-columns: 1.2fr 1fr; }
        }
        .table-container {
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow-x: auto;
            max-height: 80vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            position: sticky;
            top: 0;
            background: #090d16;
            color: var(--muted);
            padding: 14px 16px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            z-index: 10;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }
        tr {
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        tr:hover {
            background-color: var(--hover);
        }
        .active-row {
            background-color: rgba(56, 189, 248, 0.12) !important;
        }
        .active-row td {
            border-bottom: 1px solid rgba(56, 189, 248, 0.35);
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
        }
        .badge.F {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .badge.D {
            background: rgba(249, 115, 22, 0.15);
            color: #fb923c;
            border: 1px solid rgba(249, 115, 22, 0.3);
        }
        .btn-view {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.1);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            pointer-events: none;
        }
        
        /* Details Panel */
        .details-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            position: sticky;
            top: 20px;
        }
        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }
        .details-header h2 {
            margin: 0;
            color: #ffffff;
            font-size: 1.6rem;
        }
        .details-stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-box {
            flex: 1;
            background: #0f172a;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-label {
            display: block;
            color: var(--muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .stat-val {
            font-weight: 700;
            color: #ffffff;
            font-size: 1rem;
        }
        
        /* Game List */
        .game-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            font-size: 0.92rem;
        }
        .game-row:last-child {
            border-bottom: none;
        }
        .matchup {
            flex: 1;
        }
        .spread {
            color: var(--muted);
            font-size: 0.8rem;
            margin-left: 6px;
        }
        .pick-col {
            flex: 0 0 150px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }
        .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 13px;
            font-weight: bold;
        }
        .icon.correct {
            background: rgba(34, 197, 94, 0.2);
            color: var(--correct);
        }
        .icon.wrong {
            background: rgba(239, 68, 68, 0.2);
            color: var(--wrong);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MacMurphy's Football Pool</h1>
        <p>Week 1 Results & Interactive Drill-Down Dashboard</p>
    </div>

    <div class="grid">
        <!-- Leaderboard Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Participant</th>
                        <th>Wins</th>
                        <th>MNF Pick</th>
                        <th>TB Pts</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Populated by JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Drill Down Panel -->
        <div class="details-panel" id="details-panel">
            <div style="text-align: center; padding: 40px; color: var(--muted);">
                Select a participant from the leaderboard to view their detailed picks.
            </div>
        </div>
    </div>
</div>

    function renderTable() {
        const tbody = document.getElementById('leaderboard-body');
        let html = '';
        let currentRank = 1;
        let previousWins = -1;

        data.participants.forEach((p, index) => {
            if (p.wins !== previousWins) {
                currentRank = index + 1;
                previousWins = p.wins;
            }
            
            let pickName = p.mnf_pick === 'F' ? data.mnf.fav : data.mnf.dog;
            
            html += `
                <tr id="row-${p.code}" onclick="showDetails('${p.code}')">
                    <td style="font-weight:700; color:var(--muted);">${currentRank}</td>
                    <td style="font-weight:700; color:#fff;">${p.code}</td>
                    <td style="color:var(--accent); font-weight:700;">${p.wins}</td>
                    <td><span class="badge ${p.mnf_pick}">${pickName} (${p.mnf_pick})</span></td>
                    <td>${p.tb_pts}</td>
                    <td><a href="#details-panel" class="btn-view">View</a></td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
        
        if (data.participants.length > 0) {
            showDetails(data.participants[0].code);
        }
    }

    function showDetails(code) {
        document.querySelectorAll('tr').forEach(r => r.classList.remove('active-row'));
        const targetRow = document.getElementById('row-' + code);
        if (targetRow) targetRow.classList.add('active-row');
        
        const p = data.participants.find(x => x.code === code);
        const panel = document.getElementById('details-panel');
        if (!p) return;
        
        let pickName = p.mnf_pick === 'F' ? data.mnf.fav : data.mnf.dog;
        
        let html = `
            <div class="details-header">
                <h2>${p.code}'s Picks</h2>
            </div>
            <div class="details-stats">
                <div class="stat-box">
                    <span class="stat-label">Total Wins</span>
                    <span class="stat-val" style="color:var(--accent)">${p.wins} / 13</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">MNF Pick</span>
                    <span class="badge ${p.mnf_pick}" style="font-size:0.85rem">${pickName}</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Tiebreaker</span>
                    <span class="stat-val">${p.tb_pts} Pts</span>
                </div>
            </div>
            <div class="games-list">
        `;
                    
        data.games.forEach((g, i) => {
            const pick = p.picks[i];
            const actual = data.actuals[i];
            const isCorrect = pick === actual;
            
            let pickedTeam = pick === 'F' ? g.fav : g.dog;
            let iconClass = isCorrect ? 'correct' : 'wrong';
            let iconMark = isCorrect ? '✓' : '✗';
            
            html += `
                <div class="game-row">
                    <div class="matchup">
                        <strong>${g.fav}</strong> <span class="spread">(-${g.spread})</span> 
                        <span style="color:var(--muted); margin:0 4px;">vs</span> 
                        <strong>${g.dog}</strong>
                    </div>
                    <div class="pick-col">
                        <span class="badge ${pick}">${pickedTeam}</span>
                        <span class="icon ${iconClass}">${iconMark}</span>
                    </div>
                </div>
            `;
        });
        
        html += `</div>`;
        panel.innerHTML = html;
    }

    window.onload = renderTable;
</script>

</html>
